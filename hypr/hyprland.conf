# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

autogenerated = 0 # remove this line to remove the warning

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor = , 3840x2160@60.00, 0x0, 1.2, bitdepth, 10  # 10-bit broken on NVIDIA GBM
#monitor = , 3840x2160@60.00, 0x0, 1.2, bitdepth, 10, cm, srgb
#
source = ~/.config/hypr/monitors.conf
# monitorv2 {
#   output =
#   mode = 3840x2160@60.00
#   position = 0x0
#   scale = 1.2
#   bitdepth = 8
#   cm = srgb
#   vrr = 0
# }
#monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
env=WAYLAND_DISPLAY,wayland-1
# Set programs that you useth
$terminal = launch-or-focus ghostty
$fileManager = uwsm app -- nautilus ~/Downloads
$menu = rofi -show combi
$lockCmd = loginctl lock-session
$emojiPciker = rofimoji --action copy
$noctalia_ipc = qs -c noctalia-shell ipc call
#################
### AUTOSTART ###2
#################F

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
#exec-once = uwsm app - walker --gapplication-service
exec-once = echo balance_performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference
exec-once = while true; do qs -c noctalia-shell; sleep 2; done
exec-once = $HOME/.local/bin/import_env tmux
exec-once = $HOME/.local/bin/import_env system
exec-once = loginctl lock-session
exec-once = uwsm app -- hypridle

# exec-once = hyprpanel
# exec-once = ashell
# exec-once = steam
exec-once = wl-clip-persist --clipboard regular
#exec-once = uwsm app -- hyprpaper
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = uwsm app -- udiskie
exec-once = systemctl --user start hyprpolkitagent
# exec-once = swayosd-server
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

# GPU Priority: AMD iGPU for Hyprland, NVIDIA dGPU available for apps
# The AMD iGPU (10:00.0) is first, NVIDIA dGPU (01:00.0) is second
# NVIDIA first since monitor is connected to it
env = WLR_DRM_DEVICES,/dev/dri/by-path/pci-0000:01:00.0-card:/dev/dri/by-path/pci-0000:10:00.0-card

# Basic Wayland environment
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Cursor settings
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Use AMD/Mesa drivers by default (for iGPU)
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# QT and GTK Wayland support
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Theme settings
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = GTK_THEME,catppuccin-mocha-blue-standard+default

#############################
### NVIDIA GPU OFFLOADING ###
#############################
# To run an app on NVIDIA dGPU, use these environment variables:
# __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia __VK_LAYER_NV_optimus=NVIDIA_only
#
# Example: __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia blender
# Or create a launcher script for convenience
###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(211,84,0,1.0) rgba(211,84,0,1.0) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
  rounding =2
  rounding_power = 2

  dim_inactive = false
  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = false
    size = 3
    passes = 2
    vibrancy = 0.1696
  }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = true

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     3,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  easeInOutCubic, slide
    animation = workspacesIn,  1,     1.21,  easeInOutCubic, slide
    animation = workspacesOut, 1,     1.94,  easeInOutCubic, slide
    animation = zoomFactor,    1,     4,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
#workspace = w[tv1], gapsout:2, gapsin:1
#workspace = f[1], gapsout:1, gapsin:1
#windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
#windowrule = rounding 0, floating:0, onworkspace:w[tv1]
#windowrule = bordersize 0, floating:0, onworkspace:f[1]
#windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    # vrr = 1 # Disabled for iGPU (enable per-monitor if needed)
}

# Rendering settings - direct_scanout disabled for HDMI hotplug stability
render {
    direct_scanout = false
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = mac
    follow_mouse = 1
    #scroll_factor = 0.9
    sensitivity = -1 # -1.0 - 1.0, 0 means no modification.
    kb_options = ctrl:nocaps,#altwin:swap_alt_win

    accel_profile = adaptive
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = logitech-wireless-mouse-mx-master-3-1
    sensitivity = -0.3
    #scroll_factor = -0.8
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# bind = SHIFT+ALT, S, exec, $ipc controlCenter toggle
# bind = $mainMod, comma, exec, $ipc settings toggle

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, code:36, exec, uwsm app -- /home/andreiterecoasa/.local/bin/launch-or-focus ghostty
bind = $mainMod+SHIFT, code:36, exec, uwsm app -- ghostty
bind = $mainMod, Q, killactive,wo
# bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, L, exec, $lockCmd
bind = $mainMod+SHIFT, E, exec, $fileManager
bind = $mainMod+SHIFT, W, togglefloating,
bind = $mainMod, SPACE, exec, $noctalia_ipc launcher toggle
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = ALT+SHIFT+SUPER, B, exec, $noctalia_ipc launcher emoji
# bind = ALT+SHIFT, C, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy
bind = ALT+SHIFT, C, exec, $noctalia_ipc launcher clipboard
bind = SUPER+ALT+SHIFT, W, exec, xfreerdp3 /u:"tere" /p:"isg2025" /v:127.0.0.1:3389 -grab-keyboard /sound /microphone /cert:ignore /title:"Windows VM" /dynamic-resolution /gfx:AVC444 /floatbar:sticky:off,default:visible,show:fullscreen


bind = $mainMod, slash, exec, uwsm app -- proton-pass
bind = , F8 , exec, hyprshot -m region --clipboard-only
# Move focus with mainMod + arrow keys
bind = TAB+ALT, left, movefocus, l
bind = TAB+ALT, right, movefocus, r
bind = TAB+ALT, up, movefocus, u
bind = TAB+ALT, down, movefocus, d

# Move windows with mainMod + SHIFT + arrow keys
bind = $mainMod+SHIFT, left, movewindow, l
bind = $mainMod+SHIFT, right, movewindow, r
bind = $mainMod+SHIFT, up, movewindow, u
bind = $mainMod+SHIFT, down, movewindow, d

bind = SUPER, C, sendshortcut, CTRL, Insert, activewindow
bind = SUPER, V, sendshortcut, SHIFT, Insert, activewindow
bind = SUPER, Z, sendshortcut, CTRL, Z, activewindow
bind = SUPER SHIFT, Z, sendshortcut, CTRL SHIFT, Z, activewindow
bind = SUPER, A, sendshortcut, CTRL, A, activewindow

unbind = $mainMod, D # Unbinds mainMod + D, which is bound to "toggle floating" by default
unbind = $mainMod, left # Unbinds mainMod + left, which is bound to "move focus left" by default
unbind = $mainMod, right # Unbinds mainMod + right, which is bound to "move focus right" by default
unbind = $mainMod, up # Unbinds mainMod + up, which is bound to "move focus up" by default
unbind = $mainMod, down # Unbinds mainMod + down, which is bound to "move focus

bind = SUPER, LEFT, sendshortcut, ,HOME, activewindow
bind = SUPER, RIGHT, sendshortcut, ,END, activewindow

bind = SUPER SHIFT, LEFT, sendshortcut, SHIFT,HOME, activewindow
bind = SUPER SHIFT, RIGHT, sendshortcut, SHIFT,END, activewindow

bind = CTRL, UP, sendshortcut, ,Prior, activewindow
bind = CTRL, DOWN, sendshortcut, ,Next, activewindow

bind = CTRL SHIFT, UP, sendshortcut, SHIFT,Prior, activewindow
bind = CTRL SHIFT, DOWN, sendshortcut, SHIFT,Next,  activewindow


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod ALT, PERIOD, exec, hyprctl dispatch workspace +1
bind = $mainMod ALT, COMMA, exec, hyprctl dispatch workspace -1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10




# Example special workspace (scratchpad)
unbind = $mainMod, S
unbind = $mainMod, M
bind = $mainMod, TAB, togglespecialworkspace, magic
bind = $mainMod+SHIFT, TAB, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $noctalia_ipc volume increase
bindel = ,XF86AudioLowerVolume, exec, $noctalia_ipc volume decrease
bindl = ,XF86AudioMute, exec, $ipc volume muteOutput
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
# bindel = $mainMod, F5, exec, $ipc brightness decrease
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Capslock OSD indicator
bindr = , Caps_Lock, exec, swayosd-client --caps-lock

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.

xwayland {
  force_zero_scaling = true
}

source = ~/.config/hypr/window_rules.conf
