# Proton Pass specific
windowrule {
  name = windowrule-24
  float = on
  pin = on
  stay_focused = on
  size = 300 auto
  center = on
  match:class = ^Proton Pass$
}



# Center and pin important popups



# Picture in Picture
windowrule {
  name = windowrule-25
  float = on
  no_initial_focus = on
  keep_aspect_ratio = on
  size = (monitor_w*0.2) (monitor_w*0.2*9/16)
  opacity = 1.0 0.70
  pin = on
  animation = slide right
  match:title = (Picture in picture)
}

windowrule {
  name = pip-position
  move = (monitor_w-(monitor_w*0.2)-10) 40
  match:title = (Picture in picture)
}



# Float Steam
windowrule {
  name = windowrule-26
  float = on
  opacity = 1 1
  idle_inhibit = fullscreen
  match:class = steam
}

windowrule {
  name = windowrule-27
  center = on
  size = 1100 700
  match:class = steam
  match:title = Steam
}

windowrule {
  name = windowrule-28
  size = 460 800
  match:class = steam
  match:title = Friends List
}

# Nautilus rename window
windowrule {
  name = nautilus-floating
  float = on
  center = on
  size = 1200 800
  match:class = org.gnome.Nautilus
}

windowrule {
  name = cachy-os
  float = on
  center = on
  match:title = ^CachyOS.*
}


windowrule {
  name = chrome-save-file
  float = on
  center = on
  match:class = google-chrome
	match:title = Save File
}
windowrule {
  name = whatsapp-web
  workspace = special:magic
  match:class = ^chrome-hnpfjngllnobngcgfapefoaidbinmjnm-Default$
}
windowrule {
  name = telegram
  workspace = special:magic
  match:class = ^org\.telegram\.desktop$
}

windowrule {
  name = xdg-portal-float
  float = on
  center = on
  match:class = xdg-desktop-portal-gtk
}

windowrule {
  name = open-file-float
  float = on
  center = on
  size = 800 500
  match:title = ^Open File$
}
