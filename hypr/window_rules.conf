windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}



windowrule {
  name = windowrule-3
  fullscreen = on
  match:title = (NFS Underground 2)
}


windowrule {
  name = windowrule-4
  float = on
  pin = on
  stay_focused = on
  match:class = ^Proton Pass$
}


windowrule {
  name = windowrule-5
  pin = on
  stay_focused = on
  float = on
  match:class = (gcr-prompter)
}


# Authentication and login popups
windowrule {
  name = windowrule-6
  float = on
  center = on
  pin = on
  match:class = (polkit-gnome-authentication-agent-1)
}

windowrule {
  name = windowrule-7
  float = on
  match:class = (polkit-kde-authentication-agent-1)
}

windowrule {
  name = windowrule-8
  float = on
  match:class = (org.kde.polkit-kde-authentication-agent-1)
}

windowrule {
  name = windowrule-9
